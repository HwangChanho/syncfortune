<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>명리 검증</title>
<style>
/* ─────────────────────────────────────────────────────────────────────
   명리 상담가 검증 화면 (daniel 2026-07-29 · ADR-060)
   ★가독성 우선(daniel "글도 너무 작고 안보여"): 본문 18px 기준 + 상담가가 직접 4단계로 키운다.
     판정 버튼 높이 56px(터치 타깃) · 근거는 별도 박스 · 명식표 헤더 고정 톤.
   ───────────────────────────────────────────────────────────────────── */
:root{
  --bg:#f2f4f7; --card:#fff; --ink:#111418; --soft:#4a5260; --faint:#727b8a;
  --line:#dde2ea; --ju:#2f6bff; --ok:#0f9d58; --ng:#d93a3f; --pt:#e08600;
  --fs:18px;                 /* 본문 기준 — JS 로 16/18/21/24 조절 */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0 auto; max-width:820px; padding:14px 16px 64px;
  background:var(--bg); color:var(--ink);
  font:var(--fs)/1.75 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Malgun Gothic",sans-serif;
  word-break:keep-all;       /* 한국어 단어 단위 줄바꿈 — 어색한 중간 끊김 방지 */
}
h1{font-size:calc(var(--fs) * 1.35);line-height:1.4;margin:6px 0 10px;letter-spacing:-.02em}
h2{
  font-size:calc(var(--fs) * .92); color:var(--ju); margin:34px 0 10px; font-weight:800;
  letter-spacing:.02em; padding-bottom:8px; border-bottom:2px solid var(--line);
}
.lead{color:var(--soft);font-size:calc(var(--fs) * .92);margin-bottom:18px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:18px 18px 16px; margin-bottom:16px;
}
/* 명식 표 — 가로 스크롤, 글자 충분히 */
.chart{overflow-x:auto;font-size:calc(var(--fs) * .88);line-height:1.6}
.chart table{border-collapse:collapse;width:100%;margin:10px 0;min-width:420px}
.chart th,.chart td{border:1px solid var(--line);padding:9px 10px;text-align:center;white-space:nowrap}
.chart th{background:#f7f9fc;font-weight:800}
.chart b{color:var(--ju)}

/* 판정 항목 */
.num{
  display:inline-block; min-width:30px; height:30px; line-height:30px; text-align:center;
  background:var(--ju); color:#fff; border-radius:9px; font-size:calc(var(--fs) * .8);
  font-weight:800; margin-right:9px; vertical-align:2px; padding:0 6px;
}
.claim{font-size:calc(var(--fs) * 1.06);font-weight:700;line-height:1.65;margin-bottom:12px}
.basis{
  font-size:calc(var(--fs) * .92); color:var(--soft); line-height:1.7;
  background:#f7f9fc; border-radius:10px; padding:11px 13px; margin-bottom:10px;
}
.basis b{color:var(--ink)}
.meta{font-size:calc(var(--fs) * .85);color:var(--faint);margin-bottom:14px}
.meta b{color:var(--ink)}
.flag{
  background:#fff8e8; border-left:5px solid var(--pt); color:#6b4a00;
  padding:13px 15px; border-radius:10px; font-size:calc(var(--fs) * .93);
  line-height:1.7; margin:12px 0 14px;
}

/* 판정 버튼 — 터치 타깃 크게 */
.btns{display:flex;gap:10px}
button.v{
  flex:1; height:56px; font-size:calc(var(--fs) * 1.15); font-weight:800;
  border:2px solid var(--line); background:#fff; color:var(--ink);
  border-radius:12px; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
button.v:active{transform:scale(.97)}
button.v[data-on="1"]{color:#fff;border-color:transparent}
button.v.b0[data-on="1"]{background:var(--ok)}
button.v.b1[data-on="1"]{background:var(--ng)}
button.v.b2[data-on="1"]{background:var(--pt)}
button.v.b3[data-on="1"]{background:var(--soft)}
.hint{font-size:calc(var(--fs) * .8);color:var(--faint);margin-top:8px;text-align:center}

textarea{
  width:100%; margin-top:12px; padding:13px; border:2px solid var(--line); border-radius:11px;
  font:calc(var(--fs) * .95)/1.65 inherit; resize:vertical; background:#fff; color:var(--ink);
}
textarea:focus{outline:none;border-color:var(--ju)}
.saved{font-size:calc(var(--fs) * .82);color:var(--ok);font-weight:700;margin-top:8px;min-height:20px}

/* 상단 고정 진행률 + 글자크기 조절 */
.bar{
  position:sticky; top:0; z-index:10; background:var(--bg);
  padding:12px 0 10px; margin-bottom:6px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.prog{font-size:calc(var(--fs) * .92);font-weight:800;color:var(--ju);flex:1;min-width:120px}
.fsbtn{
  height:40px; min-width:44px; padding:0 12px; border:2px solid var(--line); background:#fff;
  border-radius:10px; font-size:16px; font-weight:800; color:var(--soft); cursor:pointer;
}
a{color:var(--ju);font-weight:700}
.done{text-align:center;padding:22px;font-size:calc(var(--fs) * 1.05);font-weight:800;color:var(--ok)}

@media (prefers-color-scheme: dark){
  :root{--bg:#0e1013;--card:#171a20;--ink:#f0f2f6;--soft:#a7b0be;--faint:#8b94a3;--line:#2b313a}
  .chart th{background:#1d222a}
  .basis{background:#1c2029}
  .flag{background:#2b2410;color:#f3dda6}
  button.v,textarea,.fsbtn{background:#1c2029;color:var(--ink)}
}
</style>
</head>
<body>
<div id="app"><p class="lead">불러오는 중…</p></div>

<script>
// ─────────────────────────────────────────────────────────────────────────
// ⚠️왜 이 파일이 GitHub Pages 에 있나: Supabase 는 Edge Functions·Storage 어디서도
//   HTML 을 렌더링시키지 않는다(text/plain + CSP sandbox 강제) → 브라우저에서 안 열린다.
//   그래서 **화면은 Pages · 데이터는 Edge JSON API** 로 나눴다.
//   이 repo 는 PUBLIC 이므로 여기에 명리 내용·비밀을 두지 않는다(전부 API 응답으로만 온다).
// ─────────────────────────────────────────────────────────────────────────
var API = 'https://zpslflbcxzalaikbbdzk.supabase.co/functions/v1/rag-review';
var qs = new URLSearchParams(location.search);
var T = qs.get('t') || '', S = qs.get('s') || '';
var app = document.getElementById('app');
var timers = {};

// 글자 크기 — 상담가마다 편한 크기가 다르다. 선택은 기기에 저장한다.
var SIZES = [16, 18, 21, 24];
var szIdx = Number(localStorage.getItem('rag_fs') || 1);
function applySize(){
  szIdx = Math.max(0, Math.min(SIZES.length - 1, szIdx));
  document.documentElement.style.setProperty('--fs', SIZES[szIdx] + 'px');
  localStorage.setItem('rag_fs', String(szIdx));
}
applySize();

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function md(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
function api(path, opts){
  return fetch(API + path, opts).then(function(r){
    return r.json().catch(function(){ return {ok:false, error:'HTTP ' + r.status}; });
  });
}

function load(){
  if(!T){ app.innerHTML = '<div class="card">링크가 올바르지 않습니다.<br>전달받은 주소를 <b>끝까지</b> 복사해 열어 주세요.</div>'; return; }
  var q = '?t=' + encodeURIComponent(T) + (S ? '&s=' + encodeURIComponent(S) : '');
  api(q).then(function(j){
    if(!j || !j.ok){ app.innerHTML = '<div class="card">열 수 없습니다.<br>링크가 만료되었거나 주소가 잘렸을 수 있어요.</div>'; return; }
    if(j.sets) renderList(j.sets); else renderSet(j.set, j.items);
  }).catch(function(){
    app.innerHTML = '<div class="card">통신에 실패했습니다. 잠시 후 새로고침해 주세요.</div>';
  });
}

function renderList(sets){
  var h = '<h1>명리 검증</h1><p class="lead">검증할 명식을 선택해 주세요.</p>';
  if(!sets.length) h += '<div class="card">아직 등록된 검증 세트가 없습니다.</div>';
  sets.forEach(function(r){
    h += '<div class="card"><div class="claim"><a href="?t=' + encodeURIComponent(T) + '&s=' + encodeURIComponent(r.slug) + '">'
       + esc(r.title) + '</a></div><div class="meta">판정 <b>' + r.judged + ' / ' + r.total + '</b>'
       + ' · O ' + r.ok + ' · X ' + r.ng + ' · △ ' + r.partial + ' · ? ' + r.unjudgeable + '</div></div>';
  });
  app.innerHTML = h;
}

var VERDICTS = ['O', 'X', '△', '?'];

function renderSet(set, items){
  var judged = items.filter(function(i){ return i.verdict; }).length;
  var h = '<h1>' + esc(set.title) + '</h1>';
  h += '<div class="bar"><span class="prog" id="prog">판정 ' + judged + ' / ' + items.length + '</span>'
     + '<button class="fsbtn" id="fsdn">가－</button><button class="fsbtn" id="fsup">가＋</button></div>';
  h += '<p class="lead">' + (set.intro || '') + '</p>';
  if(set.chart_md) h += '<div class="card chart">' + set.chart_md + '</div>';

  var lastSec = '';
  items.forEach(function(it){
    if(it.section && it.section !== lastSec){ lastSec = it.section; h += '<h2>' + esc(it.section) + '</h2>'; }
    h += '<div class="card">'
       + '<div class="claim"><span class="num">' + it.seq + '</span>' + md(it.claim) + '</div>'
       + (it.basis ? '<div class="basis">근거 · ' + md(it.basis) + '</div>' : '')
       + '<div class="meta">Claude 확신 <b>' + esc(it.confidence || '-') + '</b>'
       + (it.base_rate ? ' · 누구에게나 참? <b>' + esc(it.base_rate) + '</b>' : '') + '</div>'
       + (it.flag ? '<div class="flag">⚠️ ' + md(it.flag) + '</div>' : '')
       + '<div class="btns" data-id="' + it.id + '">';
    VERDICTS.forEach(function(v, i){
      h += '<button class="v b' + i + '"' + (it.verdict === v ? ' data-on="1"' : '') + ' data-v="' + v + '">' + v + '</button>';
    });
    h += '</div><div class="hint">O 맞다 · X 틀리다 · △ 부분 · ? 판정 불가</div>'
       + '<textarea rows="2" placeholder="X · △ 이면 왜인지 한 줄만 남겨 주세요">' + esc(it.expert_note || '') + '</textarea>'
       + '<div class="saved" id="s' + it.id + '"></div></div>';
  });
  h += '<div class="done">끝까지 눌러 주시면 됩니다.<br><span style="font-weight:600;color:var(--soft);font-size:.9em">닫으셔도 저장된 판정은 남습니다.</span></div>';
  app.innerHTML = h;

  document.getElementById('fsup').onclick = function(){ szIdx++; applySize(); };
  document.getElementById('fsdn').onclick = function(){ szIdx--; applySize(); };
}

// 이벤트 위임 — app 에 **한 번만** 등록한다(렌더할 때마다 붙이면 한 번 눌러도 여러 번 저장된다)
app.addEventListener('click', function(e){
  var b = e.target.closest && e.target.closest('button.v');
  if(!b) return;
  var box = b.parentNode, id = box.getAttribute('data-id');
  for(var i=0;i<box.children.length;i++) box.children[i].removeAttribute('data-on');
  b.setAttribute('data-on','1');
  var ta = box.parentNode.querySelector('textarea');
  save(id, b.getAttribute('data-v'), ta ? ta.value : '');
});
app.addEventListener('input', function(e){
  if(e.target.tagName !== 'TEXTAREA') return;
  var box = e.target.parentNode.querySelector('.btns');
  if(!box) return;
  var id = box.getAttribute('data-id'), cur = null;
  for(var i=0;i<box.children.length;i++) if(box.children[i].getAttribute('data-on')) cur = box.children[i].getAttribute('data-v');
  clearTimeout(timers[id]);
  timers[id] = setTimeout(function(){ save(id, cur, e.target.value); }, 700);   // 타이핑 멎으면 저장
});

function save(id, verdict, note){
  var el = document.getElementById('s' + id);
  if(el) el.textContent = '저장 중…';
  api('?t=' + encodeURIComponent(T), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ itemId:id, verdict:verdict, note:note })
  }).then(function(j){
    if(el) el.textContent = (j && j.ok) ? '✓ 저장됨' : ('저장 실패: ' + ((j && j.error) || ''));
    updateProg();
  }).catch(function(){ if(el) el.textContent = '저장 실패 (통신)'; });
}

function updateProg(){
  var n = document.querySelectorAll('.btns button[data-on="1"]').length;
  var t = document.querySelectorAll('.btns').length;
  var p = document.getElementById('prog');
  if(p) p.textContent = '판정 ' + n + ' / ' + t;
}

load();
</script>
</body>
</html>
