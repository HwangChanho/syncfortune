<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>명리 검증</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#14161a;--soft:#5b6270;--line:#e3e6ec;--ju:#2f6bff;--ok:#12a150;--ng:#e5484d;--pt:#f5a524}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,sans-serif;padding:16px;max-width:840px}
h1{font-size:20px;margin:8px 0 4px}
h2{font-size:15px;color:var(--soft);margin:28px 0 8px;font-weight:800}
.lead{color:var(--soft);font-size:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.chart{overflow-x:auto;font-size:13px}
.chart table{border-collapse:collapse;width:100%}
.chart th,.chart td{border:1px solid var(--line);padding:5px 8px;text-align:center;white-space:nowrap}
.claim{font-weight:700;margin-bottom:6px}
.basis{font-size:13px;color:var(--soft);margin-bottom:4px}
.meta{font-size:12px;color:var(--soft);margin-bottom:10px}
.flag{background:#fff6e5;border-left:3px solid var(--pt);padding:8px 10px;border-radius:6px;font-size:13px;margin:8px 0;color:#5c4708}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.v{flex:1;min-width:64px;padding:11px 0;font-size:16px;font-weight:800;border:1.5px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;color:var(--ink)}
button.v[data-on="1"]{color:#fff}
button.v.b0[data-on="1"]{background:var(--ok);border-color:var(--ok)}
button.v.b1[data-on="1"]{background:var(--ng);border-color:var(--ng)}
button.v.b2[data-on="1"]{background:var(--pt);border-color:var(--pt)}
button.v.b3[data-on="1"]{background:var(--soft);border-color:var(--soft)}
textarea{width:100%;margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:8px;font:14px/1.5 inherit;resize:vertical;background:var(--card);color:var(--ink)}
.saved{font-size:12px;color:var(--ok);font-weight:700;margin-top:6px;min-height:16px}
.prog{position:sticky;top:0;background:var(--bg);padding:10px 0;font-size:13px;color:var(--soft);font-weight:800;z-index:5}
a{color:var(--ju)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1114;--card:#171a1f;--ink:#eceef2;--soft:#9aa2b1;--line:#2a2f37}button.v{background:#1d2128;color:var(--ink)}.flag{background:#2a2410;color:#f0d9a0}}
</style>
</head>
<body>
<div id="app"><p class="lead">불러오는 중…</p></div>

<script>
// ─────────────────────────────────────────────────────────────────────────
// 명리 상담가 검증 화면 (daniel 2026-07-29 · ADR-060)
//
// ⚠️왜 이 파일이 Storage 에 있나: Supabase **Edge Functions 는 HTML 을 렌더링시킬 수 없다**.
//   Content-Type: text/html 을 붙여도 게이트웨이가 text/plain 으로 덮어쓰고
//   `CSP: default-src 'none'; sandbox` 를 강제한다(임의 HTML 호스팅 방지) → 브라우저에서 안 열린다.
//   그래서 **화면은 Storage 공개 버킷에서, 데이터는 Edge(JSON API)에서** 가져오는 구조다.
//
// 토큰은 URL 의 ?t= 로 받아 API 호출에만 쓴다(이 파일 자체엔 비밀이 없다).
// ─────────────────────────────────────────────────────────────────────────
var API = 'https://zpslflbcxzalaikbbdzk.supabase.co/functions/v1/rag-review';
var qs = new URLSearchParams(location.search);
var T = qs.get('t') || '';
var S = qs.get('s') || '';
var app = document.getElementById('app');
var timers = {};

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function md(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); }

function api(path, opts){
  return fetch(API + path, opts).then(function(r){ return r.json().catch(function(){ return {ok:false,error:'HTTP '+r.status}; }); });
}

function load(){
  if(!T){ app.innerHTML = '<div class="card">링크가 올바르지 않습니다. 전달받은 주소를 그대로 열어 주세요.</div>'; return; }
  var q = '?t=' + encodeURIComponent(T) + (S ? '&s=' + encodeURIComponent(S) : '');
  api(q).then(function(j){
    if(!j || !j.ok){ app.innerHTML = '<div class="card">열 수 없습니다. 링크가 만료되었거나 주소가 잘렸을 수 있어요.</div>'; return; }
    if(j.sets) renderList(j.sets); else renderSet(j.set, j.items);
  }).catch(function(){
    app.innerHTML = '<div class="card">통신에 실패했습니다. 잠시 후 새로고침해 주세요.</div>';
  });
}

function renderList(sets){
  var h = '<h1>명리 검증</h1><p class="lead">검증할 명식을 선택해 주세요.</p>';
  if(!sets.length) h += '<div class="card">아직 등록된 검증 세트가 없습니다.</div>';
  sets.forEach(function(r){
    h += '<div class="card"><div class="claim"><a href="?t=' + encodeURIComponent(T) + '&s=' + encodeURIComponent(r.slug) + '">' + esc(r.title) + '</a></div>'
       + '<div class="meta">판정 ' + r.judged + '/' + r.total + ' · O ' + r.ok + ' · X ' + r.ng + ' · △ ' + r.partial + ' · ? ' + r.unjudgeable + '</div></div>';
  });
  app.innerHTML = h;
}

var VERDICTS = ['O','X','△','?'];

function renderSet(set, items){
  var h = '<h1>' + esc(set.title) + '</h1>';
  h += '<p class="lead">' + (set.intro || '각 항목에 <strong>O</strong> / <strong>X</strong> / <strong>△</strong> / <strong>?</strong> 를 눌러 주세요. 자동 저장됩니다.') + '</p>';
  if(set.chart_md) h += '<div class="card chart">' + set.chart_md + '</div>';
  var judged = items.filter(function(i){ return i.verdict; }).length;
  h += '<div class="prog" id="prog">판정 ' + judged + ' / ' + items.length + '</div>';

  var lastSec = '';
  items.forEach(function(it){
    if(it.section && it.section !== lastSec){ lastSec = it.section; h += '<h2>' + esc(it.section) + '</h2>'; }
    h += '<div class="card">'
       + '<div class="claim">' + it.seq + '. ' + md(it.claim) + '</div>'
       + (it.basis ? '<div class="basis">근거 · ' + md(it.basis) + '</div>' : '')
       + '<div class="meta">Claude 확신 <b>' + esc(it.confidence || '-') + '</b>'
       + (it.base_rate ? ' · 누구에게나 참? ' + esc(it.base_rate) : '') + '</div>'
       + (it.flag ? '<div class="flag">⚠️ ' + md(it.flag) + '</div>' : '')
       + '<div class="btns" data-id="' + it.id + '">';
    VERDICTS.forEach(function(v, i){
      h += '<button class="v b' + i + '"' + (it.verdict === v ? ' data-on="1"' : '') + ' data-v="' + v + '">' + v + '</button>';
    });
    h += '</div>'
       + '<textarea rows="2" placeholder="X·△ 이면 왜인지 한 줄만 남겨 주세요">' + esc(it.expert_note || '') + '</textarea>'
       + '<div class="saved" id="s' + it.id + '"></div></div>';
  });
  h += '<p class="lead">끝까지 눌러 주시면 됩니다. 닫으셔도 저장된 판정은 남습니다.</p>';
  app.innerHTML = h;

  // 이벤트 위임 — 버튼/메모
  app.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button.v') : null;
    if(!b) return;
    var box = b.parentNode, id = box.getAttribute('data-id');
    for(var i=0;i<box.children.length;i++) box.children[i].removeAttribute('data-on');
    b.setAttribute('data-on','1');
    var ta = box.parentNode.querySelector('textarea');
    save(id, b.getAttribute('data-v'), ta ? ta.value : '');
  });
  app.addEventListener('input', function(e){
    if(e.target.tagName !== 'TEXTAREA') return;
    var card = e.target.parentNode, box = card.querySelector('.btns'), id = box.getAttribute('data-id');
    var cur = null;
    for(var i=0;i<box.children.length;i++) if(box.children[i].getAttribute('data-on')) cur = box.children[i].getAttribute('data-v');
    clearTimeout(timers[id]);
    timers[id] = setTimeout(function(){ save(id, cur, e.target.value); }, 600);   // 타이핑 멎으면 저장
  });
}

function save(id, verdict, note){
  var el = document.getElementById('s' + id);
  if(el) el.textContent = '저장 중…';
  api('?t=' + encodeURIComponent(T), {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ itemId: id, verdict: verdict, note: note })
  }).then(function(j){
    if(el) el.textContent = (j && j.ok) ? '저장됨' : ('저장 실패: ' + ((j && j.error) || ''));
    updateProg();
  }).catch(function(){ if(el) el.textContent = '저장 실패 (통신)'; });
}

function updateProg(){
  var n = document.querySelectorAll('.btns button[data-on="1"]').length;
  var t = document.querySelectorAll('.btns').length;
  var p = document.getElementById('prog');
  if(p) p.textContent = '판정 ' + n + ' / ' + t;
}

load();
</script>
</body>
</html>
