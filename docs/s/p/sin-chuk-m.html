body{margin:0;background:var(--bg);color:var(--ink);

.note{margin:11px 0 0;text-align:center;font-size:12px;line-height:1.6;color:var(--soft)}
.hair{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}
@media (prefers-color-scheme:dark){
  :root{--bg:#16140F;--card:#211E18;--ink:#EFE8DA;--soft:#A79E8E;--gold:#D3AC58;--line:#3A342A}
  .chip{background:#2A251D}
