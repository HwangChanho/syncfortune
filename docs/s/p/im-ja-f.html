<title>한겨울의 큰 강 — 니운내운</title><style>
:root{--bg:#F7F3EA;--card:#FFFFFF;--ink:#2B2724;--soft:#6E675E;--gold:#B08B37;--line:#E7DFCE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
.wrap{width:100%;max-width:380px}
.brand{text-align:center;font-size:14px;font-weight:800;letter-spacing:.6px;color:var(--soft);margin-bottom:14px}
.brand b{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 8px 28px rgba(80,66,40,.10)}
.hero{display:block;width:100%;aspect-ratio:832/1216;object-fit:cover;background:#F0E9DA}
.body{padding:20px 20px 22px}
.kicker{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--gold);margin:0 0 8px}
h1{margin:0;font-size:23px;line-height:1.32;font-weight:900;letter-spacing:-.2px;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:13px 0 0}
.chip{border:1px solid var(--line);background:#FBF7EE;color:var(--gold);border-radius:999px;
  padding:5px 11px;font-size:12px;font-weight:800}
p.sum{margin:14px 0 0;font-size:14.5px;line-height:1.72;color:var(--soft)}
.cta{display:block;margin:18px 0 0;padding:14px;background:var(--gold);color:#FFF;text-align:center;
  font-size:15px;font-weight:900;border-radius:12px;text-decoration:none}
.note{margin:11px 0 0;text-align:center;font-size:12px;line-height:1.6;color:var(--soft)}
.hair{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}
@media (prefers-color-scheme:dark){
  :root{--bg:#16140F;--card:#211E18;--ink:#EFE8DA;--soft:#A79E8E;--gold:#D3AC58;--line:#3A342A}
  .chip{background:#2A251D}
  .card{box-shadow:0 8px 28px rgba(0,0,0,.35)}
}</style>
